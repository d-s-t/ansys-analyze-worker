[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansys-analyze-worker"
version = "0.1.0"
description = "Generic background worker that watches a task queue and runs Ansys Electronics Desktop analyses"
requires-python = ">=3.9"
# Base install is deliberately dependency-free: ansys_analyze_worker.queue_common
# (the only module a Part 1/Part 3 "client" project needs -- see the README)
# is pure stdlib by design, so a client can `pip install` this package without
# pulling in AEDT/plotting/tray-icon libraries it never uses. Everything the
# worker itself needs lives in the "server" extra below.
dependencies = []

[project.optional-dependencies]
server = [
    # Pinned deliberately -- see docs/ARCHITECTURE.md section 12.
    "pyaedt==1.0.0",
    "pandas",
    "matplotlib",
    "pystray",
    "Pillow",
]

[project.scripts]
# After `pip install .[server]` (or a non-editable install with the
# "server" extra), this makes `ansys-analyze-worker` runnable from
# anywhere, equivalent to `python -m ansys_analyze_worker.run_service`.
ansys-analyze-worker = "ansys_analyze_worker.run_service:main"

[tool.setuptools.packages.find]
include = ["ansys_analyze_worker*"]
